<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 14; }
      .blue { fill: #dbeafe; }
      .green { fill: #dcfce7; }
      .yellow { fill: #fef9c3; }
      .red { fill: #fee2e2; }
      .title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .text { font: 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .group { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; rx: 18; }
    </style>
  </defs>

  <text x="590" y="38" text-anchor="middle" class="title">BERTweet Binary Text Classification Architecture</text>

  <rect x="35" y="95" width="135" height="78" class="box blue"/>
  <text x="102" y="125" text-anchor="middle" class="text">Raw Text</text>
  <text x="102" y="149" text-anchor="middle" class="small">tweet / claim / news</text>

  <rect x="210" y="95" width="150" height="78" class="box"/>
  <text x="285" y="125" text-anchor="middle" class="text">Normalize</text>
  <text x="285" y="149" text-anchor="middle" class="small">HTML + whitespace</text>

  <rect x="400" y="95" width="160" height="78" class="box blue"/>
  <text x="480" y="125" text-anchor="middle" class="text">BERTweet</text>
  <text x="480" y="149" text-anchor="middle" class="small">Tokenizer</text>

  <rect x="600" y="95" width="170" height="78" class="box"/>
  <text x="685" y="125" text-anchor="middle" class="text">input_ids</text>
  <text x="685" y="149" text-anchor="middle" class="small">attention_mask</text>

  <rect x="810" y="75" width="320" height="210" class="group"/>
  <text x="970" y="104" text-anchor="middle" class="text">BERTweet Transformer Encoder</text>

  <rect x="845" y="130" width="250" height="46" class="box green"/>
  <text x="970" y="159" text-anchor="middle" class="small">Token + Position Embeddings</text>

  <rect x="845" y="190" width="250" height="46" class="box green"/>
  <text x="970" y="219" text-anchor="middle" class="small">Stacked Transformer Encoder Layers</text>

  <rect x="845" y="250" width="250" height="46" class="box green"/>
  <text x="970" y="279" text-anchor="middle" class="small">Contextual Hidden States</text>

  <rect x="210" y="335" width="180" height="78" class="box yellow"/>
  <text x="300" y="365" text-anchor="middle" class="text">First-token</text>
  <text x="300" y="389" text-anchor="middle" class="small">sentence representation</text>

  <rect x="430" y="335" width="160" height="78" class="box yellow"/>
  <text x="510" y="365" text-anchor="middle" class="text">Dropout</text>
  <text x="510" y="389" text-anchor="middle" class="small">regularization</text>

  <rect x="630" y="335" width="170" height="78" class="box yellow"/>
  <text x="715" y="365" text-anchor="middle" class="text">Dense + Activation</text>
  <text x="715" y="389" text-anchor="middle" class="small">classification head</text>

  <rect x="840" y="335" width="145" height="78" class="box yellow"/>
  <text x="912" y="365" text-anchor="middle" class="text">Linear</text>
  <text x="912" y="389" text-anchor="middle" class="small">hidden -> 2</text>

  <rect x="1025" y="335" width="120" height="78" class="box red"/>
  <text x="1085" y="365" text-anchor="middle" class="text">Logits</text>
  <text x="1085" y="389" text-anchor="middle" class="small">label 0 / 1</text>

  <path d="M170 134 L210 134" class="arrow"/>
  <path d="M360 134 L400 134" class="arrow"/>
  <path d="M560 134 L600 134" class="arrow"/>
  <path d="M770 134 L845 153" class="arrow"/>
  <path d="M970 296 C970 322 300 305 300 335" class="arrow"/>
  <path d="M390 374 L430 374" class="arrow"/>
  <path d="M590 374 L630 374" class="arrow"/>
  <path d="M800 374 L840 374" class="arrow"/>
  <path d="M985 374 L1025 374" class="arrow"/>

  <text x="103" y="232" text-anchor="middle" class="small">Only text is used</text>
  <text x="103" y="252" text-anchor="middle" class="small">id/event are not model inputs</text>

  <text x="590" y="475" text-anchor="middle" class="small">
    End-to-end fine-tuning updates both the pretrained BERTweet encoder and the binary classification head.
  </text>
</svg>
